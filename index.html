<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<!-- Тема одна — «Бумага» (2026-10-08). «only light» — чтобы Chrome на Android
     с включённым тёмным режимом не перекрашивал страницу сам. -->
<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.webmanifest">
<title>Лучезарность</title>
<!-- Значок вкладки — знак владельца, векторный, прямо в разметке: тот же
     эталон manim/kanal/logo.svg. Иконки для домашнего экрана — PNG
     в assets/icons/, нарисованы из тех же координат (2026-10-07). -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50'/%3E%3Cg stroke='%23FDD17A' stroke-width='2.6'%3E%3Cline x1='50.0' y1='57.0' x2='50.0' y2='90.0'/%3E%3Cline x1='56.1' y1='53.5' x2='84.6' y2='70.0'/%3E%3Cline x1='57.0' y1='50.0' x2='80.0' y2='50.0'/%3E%3Cline x1='56.1' y1='46.5' x2='84.6' y2='30.0'/%3E%3Cline x1='53.5' y1='43.9' x2='65.0' y2='24.0'/%3E%3Cline x1='50.0' y1='43.0' x2='50.0' y2='10.0'/%3E%3Cline x1='46.5' y1='43.9' x2='35.0' y2='24.0'/%3E%3Cline x1='43.9' y1='46.5' x2='15.4' y2='30.0'/%3E%3Cline x1='43.0' y1='50.0' x2='20.0' y2='50.0'/%3E%3Cline x1='43.9' y1='53.5' x2='15.4' y2='70.0'/%3E%3C/g%3E%3Cg fill='%23fff'%3E%3Cpolygon points='50.0,50.0 61.5,76.3 73.0,89.8 67.0,73.1'/%3E%3Cpolygon points='50.0,50.0 33.0,73.1 27.0,89.8 38.5,76.3'/%3E%3Ccircle cx='50' cy='50' r='4.5'/%3E%3C/g%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Лучезарность">
<link rel="preload" href="assets/fonts/golos-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/style.css?v=202610081334">

<!-- Единственное, что тянется со стороны: разбор markdown и вёрстка формул.
     Писать это руками — недели работы и свои же ошибки. Версии закреплены;
     когда дойдут руки, оба файла кладутся в assets/ и внешних запросов
     не остаётся вовсе. -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>

<meta name="build" content="202610081334">
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <!-- Знак владельца вместо надписи (2026-10-07). Эталон — manim/kanal/logo.svg
         в knowledge, перенесён как есть. Встроен в разметку, а не файлом: приходит
         вместе со страницей и не мигает пустым местом. Имя для читалки экрана —
         у ссылки, сам рисунок ей не читается. -->
    <a class="brand" href="#/" aria-label="Лучезарность">
      <svg class="brand-logo" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
        <circle cx="50" cy="50" r="50" fill="#000"/>
        <g stroke="#FDD17A" stroke-width="2.6">
          <line x1="50.0" y1="57.0" x2="50.0" y2="90.0"/>
          <line x1="56.1" y1="53.5" x2="84.6" y2="70.0"/>
          <line x1="57.0" y1="50.0" x2="80.0" y2="50.0"/>
          <line x1="56.1" y1="46.5" x2="84.6" y2="30.0"/>
          <line x1="53.5" y1="43.9" x2="65.0" y2="24.0"/>
          <line x1="50.0" y1="43.0" x2="50.0" y2="10.0"/>
          <line x1="46.5" y1="43.9" x2="35.0" y2="24.0"/>
          <line x1="43.9" y1="46.5" x2="15.4" y2="30.0"/>
          <line x1="43.0" y1="50.0" x2="20.0" y2="50.0"/>
          <line x1="43.9" y1="53.5" x2="15.4" y2="70.0"/>
        </g>
        <polygon points="50.0,50.0 61.5,76.3 73.0,89.8 67.0,73.1" fill="#fff"/>
        <polygon points="50.0,50.0 33.0,73.1 27.0,89.8 38.5,76.3" fill="#fff"/>
        <circle cx="50" cy="50" r="4.5" fill="#fff"/>
      </svg>
    </a>
    <!-- Поиск по названиям — над вкладками, потому что ищет по всем сразу.
         Форма, а не голое поле: читалка экрана объявляет её как поиск,
         а Enter открывает первое найденное вместо перезагрузки. -->
    <form class="search" role="search" id="search-form">
      <input class="search-input" id="search" type="search" placeholder="Поиск"
             aria-label="Поиск по названиям" autocomplete="off" spellcheck="false"
             enterkeyhint="go">
    </form>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab" type="button" data-view="proekty" aria-selected="true">Проекты</button>
    <button class="tab" type="button" data-view="physics" aria-selected="false">Физика</button>
    <button class="tab" type="button" data-view="math" aria-selected="false">Математика</button>
    <button class="tab" type="button" data-view="ml" aria-selected="false">ИИ</button>
    <button class="tab" type="button" data-view="roli" aria-selected="false">Роли</button>
  </nav>

  <!-- Каркас лежит прямо в разметке, а не рисуется скриптом: он должен быть виден
       ещё до того, как скрипт загрузится и сходит за индексом. Пустая страница
       на это время читается как зависание. Скрипт заменит его содержимым. -->
  <main id="main">
    <div class="skeleton" aria-hidden="true">
      <span class="skel-head"></span>
      <span class="skel-row"></span>
      <span class="skel-row"></span>
      <span class="skel-row"></span>
    </div>
  </main>
</div>
<script defer src="assets/app.js?v=202610081334"></script>
</body>
</html>
