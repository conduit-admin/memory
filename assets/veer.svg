<svg xmlns="http://www.w3.org/2000/svg" width="96" height="48" viewBox="0 0 96 48">
  <!-- Веер ар-деко: ряды вееров из концентрических дуг, каждый следующий ряд
       накрывает нижнюю половину предыдущего. Плоские платиновые линии на белом,
       без объёма; веер радиусом 48, три дуги, ряды через 24.

       Файл собран скриптом tools/veer.py: каждый веер, заходящий в плитку,
       нарисован в ней целиком, ряды сверху вниз, — плитки рисуются
       по отдельности и обрезаются по краю. -->
  <rect width="96" height="48" fill="#fff"/>
  <circle cx="48" cy="-24" r="47.4" fill="#fff" stroke="#D5D8DE" stroke-width="1.2"/><circle cx="48" cy="-24" r="31.6" fill="none" stroke="#D5D8DE" stroke-width="1.1"/><circle cx="48" cy="-24" r="15.8" fill="none" stroke="#D5D8DE" stroke-width="1.1"/>
  <circle cx="0" cy="0" r="47.4" fill="#fff" stroke="#D5D8DE" stroke-width="1.2"/><circle cx="0" cy="0" r="31.6" fill="none" stroke="#D5D8DE" stroke-width="1.1"/><circle cx="0" cy="0" r="15.8" fill="none" stroke="#D5D8DE" stroke-width="1.1"/><circle cx="96" cy="0" r="47.4" fill="#fff" stroke="#D5D8DE" stroke-width="1.2"/><circle cx="96" cy="0" r="31.6" fill="none" stroke="#D5D8DE" stroke-width="1.1"/><circle cx="96" cy="0" r="15.8" fill="none" stroke="#D5D8DE" stroke-width="1.1"/>
  <circle cx="48" cy="24" r="47.4" fill="#fff" stroke="#D5D8DE" stroke-width="1.2"/><circle cx="48" cy="24" r="31.6" fill="none" stroke="#D5D8DE" stroke-width="1.1"/><circle cx="48" cy="24" r="15.8" fill="none" stroke="#D5D8DE" stroke-width="1.1"/>
  <circle cx="0" cy="48" r="47.4" fill="#fff" stroke="#D5D8DE" stroke-width="1.2"/><circle cx="0" cy="48" r="31.6" fill="none" stroke="#D5D8DE" stroke-width="1.1"/><circle cx="0" cy="48" r="15.8" fill="none" stroke="#D5D8DE" stroke-width="1.1"/><circle cx="96" cy="48" r="47.4" fill="#fff" stroke="#D5D8DE" stroke-width="1.2"/><circle cx="96" cy="48" r="31.6" fill="none" stroke="#D5D8DE" stroke-width="1.1"/><circle cx="96" cy="48" r="15.8" fill="none" stroke="#D5D8DE" stroke-width="1.1"/>
  <circle cx="48" cy="72" r="47.4" fill="#fff" stroke="#D5D8DE" stroke-width="1.2"/><circle cx="48" cy="72" r="31.6" fill="none" stroke="#D5D8DE" stroke-width="1.1"/><circle cx="48" cy="72" r="15.8" fill="none" stroke="#D5D8DE" stroke-width="1.1"/>
</svg>
