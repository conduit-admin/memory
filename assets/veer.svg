<svg xmlns="http://www.w3.org/2000/svg" width="96" height="48" viewBox="0 0 96 48">
  <!-- Веер ар-деко: ряды вееров из концентрических дуг, каждый следующий ряд
       накрывает нижнюю половину предыдущего. Плоские платиновые линии на белом,
       без объёма. Разрежен по просьбе владельца (2026-10-08): веер радиусом 48
       вместо 28 и три дуги вместо четырёх — между линиями 16 вместо 7.
       Плитка 96 на 48 — два ряда, ряды через 24. Плитки рисуются по отдельности
       и обрезаются по краю, поэтому в каждой нарисованы все веера, которые
       в неё заходят, сверху вниз. -->
  <defs>
    <g id="v">
      <circle r="47.4" fill="#fff" stroke="#D5D8DE" stroke-width="1.2"/>
      <circle r="31.6" fill="none" stroke="#D5D8DE" stroke-width="1.1"/>
      <circle r="15.8" fill="none" stroke="#D5D8DE" stroke-width="1.1"/>
    </g>
  </defs>
  <rect width="96" height="48" fill="#fff"/>
  <use href="#v" x="48" y="-24"/>
  <use href="#v" x="0" y="0"/>
  <use href="#v" x="96" y="0"/>
  <use href="#v" x="48" y="24"/>
  <use href="#v" x="0" y="48"/>
  <use href="#v" x="96" y="48"/>
  <use href="#v" x="48" y="72"/>
</svg>
