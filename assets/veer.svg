<svg xmlns="http://www.w3.org/2000/svg" width="56" height="28" viewBox="0 0 56 28">
  <!-- Веер ар-деко: ряды вееров из концентрических дуг, каждый следующий ряд
       накрывает нижнюю половину предыдущего. Плоские платиновые линии на белом,
       без объёма. Плитка 56 на 28 — два ряда; веер радиусом 28, ряды через 14.
       Плитки рисуются по отдельности и обрезаются по краю, поэтому в каждой
       нарисованы все веера, которые в неё заходят, сверху вниз. -->
  <defs>
    <g id="v">
      <circle r="27.4" fill="#fff" stroke="#D5D8DE" stroke-width="1.2"/>
      <circle r="20.5" fill="none" stroke="#D5D8DE" stroke-width="1.1"/>
      <circle r="13.6" fill="none" stroke="#D5D8DE" stroke-width="1.1"/>
      <circle r="6.7" fill="none" stroke="#D5D8DE" stroke-width="1.1"/>
    </g>
  </defs>
  <rect width="56" height="28" fill="#fff"/>
  <use href="#v" x="28" y="-14"/>
  <use href="#v" x="0" y="0"/>
  <use href="#v" x="56" y="0"/>
  <use href="#v" x="28" y="14"/>
  <use href="#v" x="0" y="28"/>
  <use href="#v" x="56" y="28"/>
  <use href="#v" x="28" y="42"/>
</svg>
