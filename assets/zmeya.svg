  <!-- Змея — одна, внизу каждой страницы (владелец, 2026-10-08). Вторая
       попытка: «максимально простую, как на либертарианском флаге России».
       Одна толстая чёрная линия, свёрнутая спиралью от хвоста в середине
       наружу, шея поднимается из верха спирали, голова смотрит влево,
       язык раздвоен. Спираль — из полуокружностей с двумя центрами
       через 5: витки идут ровно через 10, линия 6 — между витками
       просвет 4. Первая змея — петля с погремушкой, пастью и узором —
       вышла слишком подробной. -->
