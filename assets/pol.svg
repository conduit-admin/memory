<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- Пол дворцового зала: раскладка «восьмиугольник и вставка». Плита —
       светлый полированный камень с двойной линией инкрустации. На стыках
       четырёх плит — ромб платины: четыре грани от разных плиток сходятся
       в пирамидку, свет сверху слева, поэтому верхняя левая грань светлее
       всех, нижняя правая — темнее. В середине плиты — маленький ромб
       того же металла. -->
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E2E5EA"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#F1F3F6"/>
      <stop offset="1" stop-color="#D2D6DD"/>
    </linearGradient>
    <linearGradient id="g3" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D9DDE3"/>
      <stop offset="1" stop-color="#BCC1CA"/>
    </linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C6CBD3"/>
      <stop offset="1" stop-color="#A4AAB5"/>
    </linearGradient>
    <linearGradient id="kamen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#FBFBFC"/>
      <stop offset="1" stop-color="#F2F3F5"/>
    </linearGradient>
  </defs>

  <!-- грани ромбов на стыках: у каждой плитки по одной грани от четырёх ромбов -->
  <polygon points="96,96 68,96 96,68" fill="url(#g1)"/>
  <polygon points="0,96 0,68 28,96" fill="url(#g2)"/>
  <polygon points="96,0 96,28 68,0" fill="url(#g3)"/>
  <polygon points="0,0 28,0 0,28" fill="url(#g4)"/>

  <!-- плита и шов вокруг неё -->
  <polygon points="28,0 68,0 96,28 96,68 68,96 28,96 0,68 0,28"
           fill="url(#kamen)" stroke="#C2C7CF" stroke-width="1"/>
  <!-- линия инкрустации внутри плиты -->
  <polygon points="30.5,6 65.5,6 90,30.5 90,65.5 65.5,90 30.5,90 6,65.5 6,30.5"
           fill="none" stroke="#D5D9DF" stroke-width="0.8"/>

  <!-- ромб в середине плиты, те же грани -->
  <polygon points="48,41 48,48 41,48" fill="url(#g1)"/>
  <polygon points="48,41 55,48 48,48" fill="url(#g2)"/>
  <polygon points="41,48 48,48 48,55" fill="url(#g3)"/>
  <polygon points="48,48 55,48 48,55" fill="url(#g4)"/>
</svg>
